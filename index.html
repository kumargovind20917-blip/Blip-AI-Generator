<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator - Create Free Visuals</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .option-box label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #0284c7;
            color: white;
        }

        .btn-primary:hover {
            background: #0369a1;
        }

        .btn-secondary {
            background: #334155;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .output-box {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            padding: 10px;
        }

        .output-box img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            display: none;
        }

        .placeholder-text {
            color: #64748b;
            text-align: center;
            font-size: 0.9rem;
        }

        .loader {
            display: none;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .download-btn {
            display: none;
            margin-top: 15px;
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }

        .download-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-wand-magic-sparkles"></i> AI Image Generator</h1>
            <p>Turn your imagination into stunning AI-generated visuals for free!</p>
        </header>

        <div class="input-group">
            <textarea id="promptInput" placeholder="Describe what you want to see... (e.g. A cute cat in superhero costume)"></textarea>
            
            <div class="options-grid">
                <div class="option-box">
                    <label>Art Style</label>
                    <select id="styleSelect">
                        <option value="">Default (Natural)</option>
                        <option value="photorealistic, 8k resolution, highly detailed">Realistic Photo</option>
                        <option value="anime style, vibrant colors">Anime</option>
                        <option value="3D render, Pixar style, smooth lighting">3D Render</option>
                        <option value="cyberpunk style, neon lights">Cyberpunk</option>
                        <option value="cinematic lighting, epic scene">Cinematic</option>
                    </select>
                </div>
                <div class="option-box">
                    <label>Aspect Ratio</label>
                    <select id="ratioSelect">
                        <option value="1:1">Square (1:1)</option>
                        <option value="16:9">Landscape (16:9)</option>
                        <option value="9:16">Portrait (9:16)</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" onclick="generateRandomPrompt()"><i class="fa-solid fa-shuffle"></i> Random</button>
                <button class="btn btn-primary" id="generateBtn" onclick="generateImage()"><i class="fa-solid fa-bolt"></i> Generate Image</button>
            </div>
        </div>

        <div class="output-box" id="outputBox">
            <div class="loader" id="loader"></div>
            <div class="placeholder-text" id="placeholder">Your generated image will appear here</div>
            <img id="resultImage" alt="AI Generated Image">
        </div>

        <a href="#" id="downloadBtn" class="download-btn" download="ai-image.jpg" target="_blank"><i class="fa-solid fa-download"></i> Download Image</a>
    </div>

    <script>
        const randomPrompts = [
            "A cute baby panda wearing a space helmet, sitting on the moon, digital art",
            "A mystical forest with glowing mushrooms and a crystal clear river at night",
            "A futuristic flying car cruising through a neon-lit cyberpunk city",
            "An ancient underwater temple guarded by a giant glowing creature",
            "A majestic eagle made of fire flying over snow-covered mountains"
        ];

        function generateRandomPrompt() {
            const randomIndex = Math.floor(Math.random() * randomPrompts.length);
            document.getElementById('promptInput').value = randomPrompts[randomIndex];
        }

        function generateImage() {
            const promptText = document.getElementById('promptInput').value.trim();
            const style = document.getElementById('styleSelect').value;
            const ratio = document.getElementById('ratioSelect').value;

            if (!promptText) {
                alert('Kripya koi prompt likhein!');
                return;
            }

            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            const resultImg = document.getElementById('resultImage');
            const downloadBtn = document.getElementById('downloadBtn');
            const generateBtn = document.getElementById('generateBtn');

            let width = 768;
            let height = 768;

            if (ratio === "16:9") {
                width = 1024;
                height = 576;
            } else if (ratio === "9:16") {
                width = 576;
                height = 1024;
            }

            const fullPrompt = style ? `${promptText}, ${style}` : promptText;
            const cleanPrompt = encodeURIComponent(fullPrompt);
            const seed = Math.floor(Math.random() * 1000000);

            // Primary URL & Fallback URLs
            const primaryUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;
            const fallbackUrl = `https://pollinations.ai/p/${cleanPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;

            loader.style.display = 'block';
            placeholder.style.display = 'none';
            resultImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            generateBtn.disabled = true;
            generateBtn.innerText = 'Generating...';

            let tempImg = new Image();
            tempImg.src = primaryUrl;

            tempImg.onload = function() {
                displaySuccess(primaryUrl);
            };

            tempImg.onerror = function() {
                // Try fallback URL if primary fails
                let fallbackImg = new Image();
                fallbackImg.src = fallbackUrl;

                fallbackImg.onload = function() {
                    displaySuccess(fallbackUrl);
                };

                fallbackImg.onerror = function() {
                    alert('Image generate karne me dikkat aai. Kripya fir se Generate button dabayein!');
                    resetUI();
                };
            };

            function displaySuccess(url) {
                resultImg.src = url;
                resultImg.style.display = 'block';
                loader.style.display = 'none';

                downloadBtn.href = url;
                downloadBtn.style.display = 'inline-block';

                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Generate Image';
            }

            function resetUI() {
                loader.style.display = 'none';
                placeholder.style.display = 'block';
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Generate Image';
            }
        }
    </script>
</body>
</html>
