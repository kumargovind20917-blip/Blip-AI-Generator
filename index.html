<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blip AI Generator - Free Image & Video Generator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 6px;
            font-weight: 700;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 8px 18px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #94a3b8;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .mode-btn.active {
            background: #0284c7;
            color: white;
            border-color: #0284c7;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
        }

        .textarea-wrapper {
            position: relative;
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 45px 12px 12px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .mic-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            background: #334155;
            color: #38bdf8;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .mic-btn:hover {
            background: #0284c7;
            color: white;
        }

        .mic-btn.recording {
            background: #ef4444;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .option-box label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #0284c7;
            color: white;
        }

        .btn-primary:hover {
            background: #0369a1;
        }

        .btn-secondary {
            background: #334155;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .output-box {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            padding: 10px;
        }

        .output-box img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
            display: none;
        }

        .placeholder-text {
            color: #64748b;
            text-align: center;
            font-size: 0.9rem;
        }

        .loader {
            display: none;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .download-btn {
            display: none;
            margin-top: 15px;
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }

        .download-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Blip AI Generator</h1>
            <p>Generate free AI Images & Video Clips instantly!</p>
        </header>

        <div class="mode-toggle">
            <button class="mode-btn active" id="imageModeBtn" onclick="setMode('image')"><i class="fa-regular fa-image"></i> AI Image</button>
            <button class="mode-btn" id="videoModeBtn" onclick="setMode('video')"><i class="fa-solid fa-video"></i> AI Video/GIF</button>
        </div>

        <div class="input-group">
            <div class="textarea-wrapper">
                <textarea id="promptInput" placeholder="Describe what you want to see... Or tap the mic to speak!"></textarea>
                <button class="mic-btn" id="micBtn" onclick="startVoiceRecognition()" title="Speak Prompt"><i class="fa-solid fa-microphone"></i></button>
            </div>
            
            <div class="options-grid" id="optionsGrid">
                <div class="option-box">
                    <label>Art Style</label>
                    <select id="styleSelect">
                        <option value="">Default (Natural)</option>
                        <option value="photorealistic, 8k resolution, highly detailed">Photorealistic</option>
                        <option value="anime style, vibrant colors">Anime</option>
                        <option value="3D render, Pixar style, smooth lighting">3D Pixar</option>
                        <option value="cyberpunk style, neon lights">Cyberpunk</option>
                        <option value="cinematic lighting, epic scene">Cinematic</option>
                        <option value="pixel art style, 16-bit retro">Pixel Art</option>
                        <option value="watercolor painting style, soft colors">Watercolor</option>
                        <option value="pencil sketch, detailed black and white">Pencil Sketch</option>
                        <option value="comic book style, marvel art">Comic Book</option>
                    </select>
                </div>
                <div class="option-box">
                    <label>Aspect Ratio</label>
                    <select id="ratioSelect">
                        <option value="1:1">Square (1:1)</option>
                        <option value="16:9">Landscape (16:9)</option>
                        <option value="9:16">Portrait (9:16)</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" onclick="generateRandomPrompt()"><i class="fa-solid fa-shuffle"></i> Random</button>
                <button class="btn btn-primary" id="generateBtn" onclick="handleGeneration()"><i class="fa-solid fa-bolt"></i> Generate</button>
            </div>
        </div>

        <div class="output-box" id="outputBox">
            <div class="loader" id="loader"></div>
            <div class="placeholder-text" id="placeholder">Your creation will appear here</div>
            <img id="resultImage" alt="AI Output">
        </div>

        <a href="#" id="downloadBtn" class="download-btn" download="blip-ai-creation.jpg" target="_blank"><i class="fa-solid fa-download"></i> Download</a>
    </div>

    <script>
        let currentMode = 'image';

        const randomPrompts = [
            "A cute baby panda wearing a space helmet, sitting on the moon",
            "A mystical forest with glowing mushrooms and a crystal clear river at night",
            "A futuristic flying car cruising through a neon-lit cyberpunk city",
            "An ancient underwater temple guarded by a giant glowing creature",
            "A majestic eagle made of fire flying over snow-covered mountains"
        ];

        function setMode(mode) {
            currentMode = mode;
            const imgBtn = document.getElementById('imageModeBtn');
            const vidBtn = document.getElementById('videoModeBtn');
            const optionsGrid = document.getElementById('optionsGrid');
            const generateBtn = document.getElementById('generateBtn');

            if (mode === 'image') {
                imgBtn.classList.add('active');
                vidBtn.classList.remove('active');
                optionsGrid.style.display = 'grid';
                generateBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Generate Image';
            } else {
                vidBtn.classList.add('active');
                imgBtn.classList.remove('active');
                optionsGrid.style.display = 'none';
                generateBtn.innerHTML = '<i class="fa-solid fa-video"></i> Generate Video/GIF';
            }
        }

        function generateRandomPrompt() {
            const randomIndex = Math.floor(Math.random() * randomPrompts.length);
            document.getElementById('promptInput').value = randomPrompts[randomIndex];
        }

        // Voice Recognition (Mic Feature)
        function startVoiceRecognition() {
            const micBtn = document.getElementById('micBtn');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Aapke browser me voice search support nahi hai. Kripya Chrome ka latest version use karein.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            recognition.lang = 'hi-IN'; // Supports Hindi and English voice input
            recognition.interimResults = false;

            recognition.onstart = function() {
                micBtn.classList.add('recording');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('promptInput').value = transcript;
                micBtn.classList.remove('recording');
            };

            recognition.onerror = function() {
                alert('Aawaaz sunne me dikkat aai. Kripya fir se bolen!');
                micBtn.classList.remove('recording');
            };

            recognition.onend = function() {
                micBtn.classList.remove('recording');
            };

            recognition.start();
        }

        function handleGeneration() {
            const promptText = document.getElementById('promptInput').value.trim();

            if (!promptText) {
                alert('Kripya bolkar ya likhkar koi prompt dein!');
                return;
            }

            if (currentMode === 'image') {
                generateImage(promptText);
            } else {
                generateVideo(promptText);
            }
        }

        function generateImage(promptText) {
            const style = document.getElementById('styleSelect').value;
            const ratio = document.getElementById('ratioSelect').value;

            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            const resultImg = document.getElementById('resultImage');
            const downloadBtn = document.getElementById('downloadBtn');
            const generateBtn = document.getElementById('generateBtn');

            let width = 768;
            let height = 768;

            if (ratio === "16:9") { width = 1024; height = 576; }
            else if (ratio === "9:16") { width = 576; height = 1024; }

            const fullPrompt = style ? `${promptText}, ${style}` : promptText;
            const cleanPrompt = encodeURIComponent(fullPrompt);
            const seed = Math.floor(Math.random() * 1000000);

            const primaryUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true`;

            showLoading();

            let tempImg = new Image();
            tempImg.src = primaryUrl;

            tempImg.onload = function() {
                displaySuccess(primaryUrl, 'blip-ai-image.jpg');
            };

            tempImg.onerror = function() {
                alert('Image generate karne me dikkat aai. Kripya dobara koshish karein!');
                resetUI();
            };
        }

        function generateVideo(promptText) {
            const cleanPrompt = encodeURIComponent(`${promptText}, animated video, loop motion`);
            const seed = Math.floor(Math.random() * 1000000);

            // Pollinations Animation Endpoint
            const videoUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=512&height=512&seed=${seed}&model=turtle&nologo=true`;

            showLoading();

            let tempImg = new Image();
            tempImg.src = videoUrl;

            tempImg.onload = function() {
                displaySuccess(videoUrl, 'blip-ai-video.gif');
            };

            tempImg.onerror = function() {
                alert('Video generate karne me dikkat aai. Kripya dobara try karein!');
                resetUI();
            };
        }

        function showLoading() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('resultImage').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
            
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.innerText = 'Generating...';
        }

        function displaySuccess(url, fileName) {
            const resultImg = document.getElementById('resultImage');
            const loader = document.getElementById('loader');
            const downloadBtn = document.getElementById('downloadBtn');
            const generateBtn = document.getElementById('generateBtn');

            resultImg.src = url;
            resultImg.style.display = 'block';
            loader.style.display = 'none';

            downloadBtn.href = url;
            downloadBtn.download = fileName;
            downloadBtn.style.display = 'inline-block';

            generateBtn.disabled = false;
            setMode(currentMode);
        }

        function resetUI() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = false;
            setMode(currentMode);
        }
    </script>
</body>
</html>
